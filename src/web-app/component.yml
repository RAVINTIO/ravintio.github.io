# RAVINTIO Component Manifest
id: "web-app"
name: "RAVINTIO Docs Web App"
feature: "0000024-explainer-six-tools"
version: "0.6.0"
status: "active"
type: "microfrontend"
domain: "documentation-site"
summary: "Static Vite site that builds and serves the RAVINTIO docs on GitHub Pages."
systemContext: "Deployed as a GitHub Pages static site by deploy.yml. Reads site-content Markdown at build time through build-docs.js and serves it as HTML."

purpose:
  responsibleFor:
    - "Render the RAVINTIO homepage"
    - "Build doc pages from src/site-content/pages at build time"
    - "Own docs.manifest.json, the source of nav sections, page order, titles, and meta descriptions"
    - "Render the section nav, top nav, and previous and next links on every page"
    - "Serve the logo, wordmark, favicons, theme toggle, and mobile menu"
    - "Run the content suite in tests/ and the Playwright regression suite in tests/e2e/"
    - "Set the theme before first paint with an inline script in each page template"
  notResponsibleFor:
    - "Page text (site-content)"
    - "The ravintio-zero pack"
    - "Site search"

responsibilities:
  - "Build and serve the static docs site"

exceptions:
  - "Must not process user-supplied content at runtime (static site only)"
  - "Must not write or edit site-content pages"

stack:
  language: "typescript"
  runtime: "node"
  framework: "vite"
  frontend: "none"
  styling: "vanilla-css"
  componentLibrary: "none"
  database: "none"
  orm: "none"
  testing: "node-test, playwright"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  apiSpec: "none"
  inputs:
    - name: "src/site-content/pages/*.md"
      type: "filesystem"
      description: "Markdown pages read at build time by scripts/build-docs.js"
    - name: "src/web-app/docs.manifest.json"
      type: "filesystem"
      description: "Sectioned manifest of nav sections, page order, titles, and meta descriptions"
  outputs:
    - name: "dist/"
      type: "filesystem"
      description: "Built static site deployed to GitHub Pages"
  consumedBy: []
  consumes:
    - "site-content"
  breakingChangePolicy: "requires-human-approval"

data:
  ownsData: false
  dataContract: "none"
  tables: []
  schemaVersion: "0.0.0"
  migrationPath: "none"

scope:
  inScope:
    - "Homepage layout and styling"
    - "Doc page build pipeline (build-docs.js)"
    - "Sectioned nav manifest"
    - "Logo, wordmark, and favicons"
    - "Theme toggle and mobile menu"
    - "Page-list disclosure on narrow screens"
    - "Mermaid diagram rendering on demand"
    - "Site tests"
    - "Playwright regression suite on Chromium"
    - "Theme set before first paint"
  outOfScope:
    - "Page text (site-content)"
    - "Site search"
  deferred: []

risk:
  level: "low"
  items:
    - "R-001: manifest and page files fall out of step"
    - "R-003: reference pages drift from the pack"
    - "scroll-margin-top: 72px fixed to the nav height"
    - "R-006: the first-frame test depends on paint order"
    - "R-007: the inline theme script needs a hash under a future Content Security Policy"

quality:
  testCoverage:
    unit: 0
    integration: 0
    e2e: 1
  techDebt:
    - "TD-002: fixed nav height in scroll-margin-top"
    - "TD-003: HTML checks use regular expressions"
  quirks:
    - "Q-001: component docs live in component-docs/"
    - "Q-002: generated docs/*.html and public/sitemap-data.json are not committed"
    - "Q-004: adding a page takes a page file and a manifest entry"
    - "Q-005: asset paths are relative, so the site works at the org root or under a path"
    - "Q-006: the Playwright suite tests an existing build, so npm run build runs first"
    - "Q-007: the theme logic lives in the inline script and in main.ts"
    - "Q-008: appType mpa, so the dev and preview servers return 404 for a missing page"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "retrofit"
  domainKnowledgePath: "plan/_archive/0000005-ravintio-docs-rewrite-2026-10-29"

metadata:
  createdAt: "2026-05-16"
  updatedAt: "2026-11-06"
  createdBy: "agent"
  lastModifiedBy: "agent"
  skill: "ravintio-implement"
  tool: "claude-code"
  model: "claude-opus-5-5"
